spring:
  application:
    name: cost-collector
  profiles:
    active: local

  datasource:
    url: jdbc:h2:mem:finops;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

server:
  port: 8082

aws:
  region: ap-northeast-2

collector:
  schedule:
    cron: "0 0 9 * * *"

logging:
  level:
    com.finops: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
